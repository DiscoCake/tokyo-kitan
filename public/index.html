<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>東京奇譚</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/wanakana/5.3.1/wanakana.min.js"></script>
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <div id="setup-screen">
    <div>
      <div class="setup-title"><ruby>冒険<rt>ぼうけん</rt></ruby>を<ruby>始<rt>はじ</rt></ruby>めよう</div>
      <p class="setup-sub">
        <ruby>東京<rt>とうきょう</rt></ruby>を<ruby>舞台<rt>ぶたい</rt></ruby>にした<ruby>謎<rt>なぞ</rt></ruby>の<ruby>物語<rt>ものがたり</rt></ruby>。<br>
        <ruby>読<rt>よ</rt></ruby>んで、<ruby>選<rt>えら</rt></ruby>んで、<ruby>時々<rt>ときどき</rt></ruby><ruby>自分<rt>じぶん</rt></ruby>で<ruby>答<rt>こた</rt></ruby>えよう。
      </p>
      <div class="setup-furigana-row">
        <button class="ctrl-btn active" id="setup-furigana-btn">ふりがな</button>
      </div>
    </div>
    <div class="setup-field">
      <label>なまえ</label>
      <input type="text" id="name-input" placeholder="旅人" value="旅人" />
    </div>
    <div id="setup-buttons">
      <button id="start-btn"><ruby>新<rt>あたら</rt></ruby>しい<ruby>物語<rt>ものがたり</rt></ruby></button>
      <button id="resume-btn"><ruby>続<rt>つづ</rt></ruby>きから</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-screen">
    <div id="topbar">
      <div id="topbar-left">
        <span class="game-title"><ruby>東京<rt>とうきょう</rt></ruby><ruby>奇譚<rt>きたん</rt></ruby></span>
        <span id="scene-tag"><ruby>場面<rt>ばめん</rt></ruby> 一</span>
      </div>
      <div id="topbar-right">
        <button class="ctrl-btn active" id="furigana-btn">ふりがな</button>
        <button class="ctrl-btn" id="translation-btn">訳</button>
        <button class="ctrl-btn" id="grammar-btn"><ruby>文法<rt>ぶんぽう</rt></ruby></button>
        <button class="ctrl-btn" id="vocab-btn"><ruby>単語帳<rt>たんごちょう</rt></ruby><span class="badge" id="vocab-count" style="display:none;">0</span></button>
        <button class="ctrl-btn" id="gallery-btn"><ruby>場所<rt>ばしょ</rt></ruby></button>
        <button class="ctrl-btn" id="ambience-btn">🔇</button>
        <button class="ctrl-btn" id="restart-btn">↺</button>
      </div>
    </div>

    <div id="history-trail" style="display:none;"></div>

    <div id="scene-hero">
      <img id="hero-img" alt="" />
      <div id="hero-skeleton"></div>
      <div id="hero-overlay"></div>
      <div id="hero-location"><span class="loc-dot"></span><span id="loc-text"></span></div>
    </div>
    <div id="scene-card">
      <div id="audio-bar">
        <button class="audio-btn" id="audio-back" title="文を戻る">⏮</button>
        <button class="audio-btn" id="audio-play" title="再生 / 一時停止">▶</button>
        <div id="audio-progress-wrap">
          <div id="audio-progress-track"><div id="audio-progress-fill"></div></div>
        </div>
        <button id="audio-speed" title="速度">0.9×</button>
      </div>
      <div id="feedback-box"><span class="fb-label">先生メモ</span><span id="feedback-text"></span></div>
      <div id="scene-text"></div>
      <div id="translation-box"></div>
      <div id="grammar-box"></div>
    </div>

    <div id="items-row"><span id="items-label">もちもの</span></div>
    <div id="vocab-row"></div>

    <div id="choices"></div>

    <div id="answer-row">
      <input type="text" id="answer-input" placeholder="日本語で答えよう…" autocomplete="off" lang="ja" />
      <button id="answer-send">送信</button>
    </div>
    <div id="input-hint">ローマ字で打つと自動的にかなになります（例: konnichiha → こんにちは）<button class="ctrl-btn active" id="ime-toggle" style="margin-left:0.6rem;">ローマ字入力</button></div>
  </div>

  <!-- ENDING -->
  <div id="ending-screen">
    <h2><ruby>物語<rt>ものがたり</rt></ruby>の<ruby>終<rt>お</rt></ruby>わり</h2>
    <div id="summary-stats"></div>
    <div id="ending-actions">
      <button class="panel-btn" id="ending-vocab-btn">単語帳を見る</button>
      <button class="panel-btn" id="ending-gallery-btn">訪れた場所</button>
      <button class="panel-btn" id="ending-restart-btn">新しい物語</button>
    </div>
  </div>

</div>

<!-- VOCAB PANEL -->
<div class="panel" id="vocab-panel">
  <div class="panel-inner">
    <h2><ruby>単語帳<rt>たんごちょう</rt></ruby></h2>
    <div id="vocab-list"></div>
    <div class="panel-empty" id="vocab-empty" style="display:none;">まだ単語がありません。場面の下の単語をタップしよう。</div>
    <div class="panel-actions">
      <button class="panel-btn" id="vocab-export">Ankiにエクスポート (TSV)</button>
      <button class="panel-btn panel-close">閉じる</button>
    </div>
  </div>
</div>

<!-- GALLERY PANEL -->
<div class="panel" id="gallery-panel">
  <div class="panel-inner">
    <h2><ruby>訪<rt>おとず</rt></ruby>れた<ruby>場所<rt>ばしょ</rt></ruby></h2>
    <div id="gallery-grid"></div>
    <div class="panel-empty" id="gallery-empty" style="display:none;">まだどこにも行っていません。</div>
    <div class="panel-actions">
      <button class="panel-btn panel-close">閉じる</button>
    </div>
  </div>
</div>

<!-- CINEMATIC -->
<div id="cin-top"></div>
<div id="cin-bottom"></div>
<div id="cinematic">
  <div id="cin-location"></div>
  <div id="cin-bar"></div>
  <div id="cin-subtitle">読み込み中</div>
</div>

<div id="scale-bar">
  <button class="scale-btn" id="scale-down">−</button>
  <span id="scale-label">100%</span>
  <button class="scale-btn" id="scale-up">＋</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
